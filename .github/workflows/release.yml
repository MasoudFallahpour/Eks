name: Release

on:
  push:
    branches:
      - master

concurrency:
  group: release
  cancel-in-progress: false

jobs:

  check-version:

    name: Check version bump
    runs-on: ubuntu-latest

    outputs:
      release: ${{ steps.version.outputs.release }}
      version-name: ${{ steps.version.outputs.version-name }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compare versionCode with the previous master
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: .github/scripts/check-version-bump.sh "$BEFORE" HEAD

  release:

    name: Release APK on GitHub
    needs: check-version
    if: needs.check-version.outputs.release == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      VERSION_NAME: ${{ needs.check-version.outputs.version-name }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Create local.properties file
        env:
          storePassword: ${{ secrets.STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo storePassword=$storePassword >> ./local.properties
          echo keyPassword=$keyPassword >> ./local.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Generate APK
        run: |
          ./gradlew assembleRelease
          mv app/build/outputs/apk/release/Eks-release.apk "Eks-$VERSION_NAME.apk"

      - name: Extract release notes
        run: |
          awk -v heading="# Version $VERSION_NAME" '
            $0 == heading { found = 1; next }
            found && /^# Version / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error file=CHANGELOG.md::No release notes found under '# Version $VERSION_NAME'"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION_NAME" "Eks-$VERSION_NAME.apk" \
            --target "$GITHUB_SHA" \
            --title "Version $VERSION_NAME" \
            --notes-file release-notes.md
