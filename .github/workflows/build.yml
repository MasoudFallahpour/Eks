name: Build

on:
  pull_request:
    branches:
      - master

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Check version bump
        run: |
          read_version() {
            git show "${1}:app/build.gradle.kts" | sed -nE "s/^ *$2 = \"?([^\"]+)\"?$/\1/p"
          }
          old_code=$(read_version HEAD^1 versionCode)
          new_code=$(read_version HEAD versionCode)
          old_name=$(read_version HEAD^1 versionName)
          new_name=$(read_version HEAD versionName)
          if [ -z "$old_code" ] || [ -z "$new_code" ] || [ -z "$old_name" ] || [ -z "$new_name" ]; then
            echo "::error file=app/build.gradle.kts::Could not read versionCode/versionName"
            exit 1
          fi
          if [ "$new_code" -eq "$old_code" ]; then
            echo "versionCode unchanged ($new_code). Merging this PR will not create a release."
            exit 0
          fi
          if [ "$new_code" -lt "$old_code" ]; then
            echo "::error file=app/build.gradle.kts::versionCode decreased from $old_code to $new_code"
            exit 1
          fi
          if [ "$new_name" = "$old_name" ]; then
            echo "::error file=app/build.gradle.kts::versionCode was bumped but versionName is still $new_name"
            exit 1
          fi
          if ! grep -qxF "# Version $new_name" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md has no '# Version $new_name' section"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$new_name" > /dev/null; then
            echo "::error::Tag v$new_name already exists"
            exit 1
          fi
          echo "Merging this PR will release version $new_name (versionCode $new_code)."

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Create local.properties file
        env:
          storePassword: ${{ secrets.STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo storePassword=$storePassword >> ./local.properties
          echo keyPassword=$keyPassword >> ./local.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Run unit tests
        run: ./gradlew test

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: Nexus 6
          avd-name: test
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedCheck

      - name: Build with Gradle
        run: ./gradlew build
